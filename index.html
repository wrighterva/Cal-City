<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calvin's City">
<title>Calvin's City</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b1220;
 color:#f5f7fb;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
 padding-bottom:84px
}

header{
 position:sticky;
 top:0;
 z-index:5;
 background:#101827ee;
 backdrop-filter:blur(14px);
 padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
 border-bottom:1px solid #263247
}

h1{font-size:24px;margin:0 0 4px}
.sub{color:#9aa8bd;font-size:13px}

.screen{
 padding:16px;
 max-width:800px;
 margin:auto
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.card{
 background:#141e2e;
 border:1px solid #263247;
 border-radius:16px;
 padding:14px;
 margin-bottom:12px
}

.metric{
 font-size:23px;
 font-weight:700;
 margin-top:4px
}

.label{
 font-size:12px;
 color:#9aa8bd
}

.section{
 font-size:17px;
 font-weight:700;
 margin:18px 0 10px
}

button{
 border:0;
 border-radius:12px;
 padding:12px 14px;
 background:#2b6df3;
 color:white;
 font-weight:700;
 font-size:14px;
 min-height:44px
}

button.secondary{background:#263247}
button.good{background:#15803d}

.row{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.item{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:10px 0;
 border-bottom:1px solid #263247
}

.item:last-child{border-bottom:0}

.muted{color:#9aa8bd}

.map{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.district{
 min-height:190px;
 border-radius:15px;
 padding:12px;
 background:#111c2e;
 border:1px solid #30415c
}

.district-head{
 display:flex;
 gap:9px;
 align-items:flex-start
}

.district-icon{font-size:27px}

.district-desc{
 font-size:10px;
 color:#94a3b8;
 line-height:1.35;
 margin-top:3px
}

.parcel{
 margin-top:10px;
 padding:10px;
 border-radius:11px;
 background:#18253a;
 border:1px solid #2b3b55
}

.parcel-top{
 display:flex;
 justify-content:space-between;
 gap:8px
}

.parcel-name{
 font-weight:700;
 font-size:12px
}

.parcel-meta{
 font-size:10px;
 color:#94a3b8;
 margin-top:4px
}

.badge{
 font-size:9px;
 font-weight:800;
 padding:4px 6px;
 border-radius:999px;
 background:#263247;
 color:#cbd5e1;
 white-space:nowrap
}

.badge.available{
 background:#14532d;
 color:#86efac
}

.badge.owned{
 background:#1e3a8a;
 color:#bfdbfe
}

.badge.built{
 background:#78350f;
 color:#fde68a
}

.property-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px
}

.property-card{
 background:#101a2b;
 border:1px solid #2b3b55;
 border-radius:14px;
 padding:12px
}

.property-title{
 font-weight:700;
 font-size:13px
}

.property-desc{
 font-size:10px;
 color:#94a3b8;
 margin:4px 0 9px;
 line-height:1.35
}

.cost{
 font-size:13px;
 font-weight:800;
 margin-bottom:8px
}

.small{
 font-size:10px;
 color:#94a3b8
}

.log{
 max-height:220px;
 overflow:auto;
 font-size:12px;
 color:#b8c3d5
}

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:10;
 background:#101827f2;
 backdrop-filter:blur(14px);
 border-top:1px solid #263247;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 padding:7px 5px calc(env(safe-area-inset-bottom) + 7px)
}

.nav button{
 background:transparent;
 color:#8f9db2;
 padding:7px 2px;
 font-size:11px;
 min-height:42px
}

.nav button.active{color:white}

@media(max-width:390px){
 .map,.property-grid{
  grid-template-columns:1fr
 }
}
</style>
</head>

<body>

<header>
<h1>Calvin's City</h1>
<div class="sub" id="headerSub">Year 1 • Normal Economy</div>
</header>

<main id="app"></main>

<nav class="nav" id="nav"></nav>

  },

  {
   id:"SP-02",

   building:null

  {

 ],

let s=JSON.parse(

)||fresh;

let tab="home";


const districtInfo={

  "Finance, offices and headquarters"

 "North District":[
  "🏘️",
  "Permanent housing and apartments"
 ],

 ],

  "🛍️",

 ],

  "Hotels and residential development"
 ],

 "Sports District":[
  "🏀",
  "Three stadiums and the sports economy"
 ]

};


const buildingInfo={

 Office:[
  "Office Building",
  "Business headquarters and services"
 ],

 Bank:[
  "Bank Branch",
  "Banking and lending"
 ],

 Apartment:[
  "Apartment Building",
  "Permanent residential capacity"
 ],

 Homes:[
  "Housing",
  "Permanent residential capacity"
 ],

 Factory:[
  "Factory",
  "Industrial production"
 ],

 Warehouse:[

  "Storage and distribution"
 ],

  "Retail Center",
  "Consumer retail"
 ],

 Restaurant:[

  "Food and hospitality"
 ],

  "Hotel",
  "Temporary visitors and game traffic"
 ],

 Stadium:[
  "Stadium",

function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(s)
 );

}


function money(x){

 return "$"+
 Number(x).toFixed(2)+
 "M";

}


function log(x){

 s.log.unshift(
  "Y"+s.year+": "+x
 );

 s.log=s.log.slice(0,70);

 save();

}


function roll(){

 return Math.floor(Math.random()*6)+1+
        Math.floor(Math.random()*6)+1;

}


function card(title,body){

 return `
 <div class="card">

  <div
   class="section"
   style="margin-top:0"
  >
   ${title}
  </div>

  ${body}

 </div>
 `;

}


function buyProperty(id){

 const p=s.properties.find(
  x=>x.id===id
 );

 if(!p ||
    p.status!=="available")
  return;

 if(s.cityCash<p.price){

  alert(
   "Not enough city capital to buy this property."
  );

  return;

 }

 s.cityCash-=p.price;

 s.propertyValue+=p.price;

 p.status="owned";

 log(
  "City acquired "+
  p.id+
  " in "+
  p.district+
  " for "+
  money(p.price)+"."
 );

 save();

 render();

}


function buildProperty(id){

 const p=s.properties.find(
  x=>x.id===id
 );

 if(!p ||
    p.status!=="owned")
  return;

 const cost=
  Math.round(
   p.price*.35*100
  )/100;

 if(s.cityCash<cost){

  alert(
   "Not enough development capital to build here."
  );

  return;

 }

 s.cityCash-=cost;

 p.status="built";

 p.building=
  buildingInfo[p.type][0];

 log(
  "Built "+
  p.building+
  " on "+
  p.id+
  " for "+
  money(cost)+"."
 );

 save();

 render();

}


function sellProperty(id){

 const p=s.properties.find(
  x=>x.id===id
 );

 if(!p ||
    p.status==="available")
  return;

 const value=
  p.price*
  (p.status==="built"?1.15:1);

 s.cityCash+=value;

 s.propertyValue-=p.price;

 log(
  "Sold "+
  p.id+
  " for "+
  money(value)+"."
 );

 p.status="available";

 p.building=null;

 save();

 render();

}


function propertyMarket(){

 const owned=
  s.properties.filter(
   p=>p.status!=="available"
  ).length;

 const built=
  s.properties.filter(
   p=>p.status==="built"
  ).length;

 return `

 <div class="screen">

 ${card(
 "🏗️ Property Market",

 `

 <div class="grid">

 <div>
  <div class="label">
   City capital
  </div>

  <div class="metric">
   ${money(s.cityCash)}
  </div>
 </div>


 <div>
  <div class="label">
   Property value
  </div>

  <div class="metric">
   ${money(s.propertyValue)}
  </div>
 </div>


 <div>
  <div class="label">
   Properties owned
  </div>

  <div class="metric">
   ${owned}
  </div>
 </div>


 <div>
  <div class="label">
   Buildings built
  </div>

  <div class="metric">
   ${built}
  </div>
 </div>

 </div>


 <p class="muted">

 Land is bought first.

 Then the city pays a development cost
 to turn the parcel into a usable building.

 Businesses will later occupy these buildings.

 </p>

 `
 )}

 ${card(
 "Available Land",

 `

 <div class="property-grid">

 ${s.properties
  .filter(
   p=>p.status==="available"
  )
  .map(
   p=>`

 <div class="property-card">

  <div class="property-title">
   ${p.id} • ${p.district}
  </div>

  <div class="property-desc">
   ${p.size} ${p.type} parcel
  </div>

  <div class="cost">
   ${money(p.price)}
  </div>

  <button
   onclick="buyProperty('${p.id}')"
  >
   Buy Property
  </button>

 </div>

 `
  ).join("")}

 </div>

 `
 )}

 ${card(
 "Your Properties",

 owned===0

 ? `<div class="muted">
    You do not own any property yet.
   </div>`

 : `

 <div class="property-grid">

 ${s.properties
  .filter(
   p=>p.status!=="available"
  )
  .map(
   p=>`

 <div class="property-card">

  <div class="property-title">
   ${p.id} • ${p.district}
  </div>

  <div class="property-desc">
   ${p.size} ${p.type}
  </div>

  <div class="badge ${p.status}">
   ${p.status.toUpperCase()}
  </div>

  ${
   p.building

   ? `<div class="building">
       🏢 ${p.building}
      </div>`

   : `<div
       class="small"
       style="margin-top:8px"
      >
       Raw land
      </div>`
  }

  <div
   class="row"
   style="margin-top:10px"
  >

   ${
    p.status==="owned"

    ? `<button
        onclick="buildProperty('${p.id}')"
       >
        Build
        ${money(
         Math.round(
          p.price*.35*100
         )/100
        )}
       </button>`

    : ""
   }

   <button
    class="secondary"
    onclick="sellProperty('${p.id}')"
   >
    Sell
   </button>

  </div>

 `
  ).join("")}

 </div>

 `
 )}

 ${card(
 "Property Rules",

 `

 <div class="item">
  <span>Land</span>
  <b>Purchased by the city</b>

  <span>Built property sale value</span>

 </div>

  <span>Business placement</span>
  <b>Next system</b>
 </div>

 `

 `;

}

  d=>{

   const props=
    s.properties.filter(
     p=>p.district===d
    );

   const built=
    props.filter(
     p=>p.status==="built"

   return `

}

 ${card(

 <div>

 ${card(

 s.stocks.map(

}


function econRoll(){

 const r=roll();

 s.econ=
  r<=4
  ?"Recession"
  :r<=9
  ?"Normal"
  :"Boom";

 log(
  "Economic roll: "+
  r+
  " → "+
  s.econ
 );

 return r;

}


function popRoll(){

 const r=roll();

 const pct=
  r<=4
  ?-1
  :r<=6
  ?0
  :r<=8
  ?1
  :r<=10
  ?2
  :3;

 s.pop=Math.max(
  1000,
  Math.round(
   s.pop*(1+pct/100)
  )
 );

 log(
  "Population roll "+
  r+
  " → "+
  (pct>=0?"+":"")+
  pct+
  "% population."
 );

 return {r,pct};

}


function mwtpReset(){

 const r=roll();

 const base=s.mwtp;

 let pct=
  (s.econ==="Boom"
   ?2
   :s.econ==="Recession"
   ?-2
   :0)
  +
  (r>=10
   ?2
   :r<=4
   ?-2
   :0);

 s.mwtp=Math.max(
  5,
  Math.round(
   base*
   (1+pct/100)*
   100
  )/100
 );

 log(
  "MWTP reset: "+
  money(base)+
  " → "+
  money(s.mwtp)+
  " per meal."
 );

 return {r,pct};

}


function commodityRoll(){

 const moves={
  2:-10,
  3:-8,
  4:-6,
  5:-4,
  6:-2,
  7:2,
  8:4,
  9:6,
  10:8,
  11:10,
  12:12
 };

 const r=roll();

 for(
  const k in s.commodities
 ){

  s.commodities[k]=
   Math.round(
    s.commodities[k]*
    (1+moves[r]/100)*
    100
   )/100;

 }

 log(
  "Commodity roll "+
  r+
  " → prices move "+
  (moves[r]>=0?"+":"")+
  moves[r]+
  "%."
 );

 return {
  r,
  move:moves[r]
 };

}


function season(){

 const demand=
  Math.round(s.pop*3);

 const avg=
  (
   s.food[0].price+
   s.food[1].price
  )/2;

 const sensitivity=
  Math.max(
   .2,
   1-
   Math.max(
    0,
    avg-s.mwtp
   )*.12
  );

 const total=
  Math.round(
   demand*sensitivity
  );

 let weights=
  s.food.map(
   f=>
   Math.max(
    .1,
    (100-f.price*2)+
    (f.quality*4)+
    (f.brand*3)
   )
  );

 let sum=
  weights.reduce(
   (a,b)=>a+b,
   0
  );

 s.food.forEach(
  (f,i)=>{

   const sales=
    Math.round(
     total*
     weights[i]/
     sum
    );

   const costPer=
    s.commodities.Grain*.3+
    s.commodities.Meat*.35+
    s.commodities.Produce*.25;

   const revenue=
    sales*f.price;

   const costs=
    sales*costPer;

   const profit=
    (revenue-costs)/1000000;

   f.cash+=profit;

   f.inventory=
    Math.max(
     0,
     30000-sales
    );

   s.treasury+=
    revenue*
    .05/
    1000000;

   s.stocks[i].price=
    Math.max(
     1,
     s.stocks[i].price*
     (
      1+
      profit/
      Math.max(1,f.cash)*
      .25
     )
    );

   log(
    f.name+
    " sold "+
    sales.toLocaleString()+
    " meals, profit "+
    money(profit)+
    "."
   );

  }
 );

 log(
  "Federal Market cleared "+
  total.toLocaleString()+
  " meals from "+
  demand.toLocaleString()+
  " potential demand."
 );

}


function newYear(){

 s.year++;

 popRoll();

 econRoll();

 mwtpReset();

 commodityRoll();

 save();

 render();

}


function render(){

 document.getElementById(
  "headerSub"
 ).textContent=
  `Year ${s.year} • ${s.econ} Economy`;

 const pages={
  home,
  city,
  property:propertyMarket,
  markets,
  finance
 };

 document.getElementById(
  "app"
 ).innerHTML=
  pages[tab]();


 const labels=[

  ["home","⌂","Home"],

  ["city","🏙","City"],

  ["property","🏗","Property"],

  ["markets","📊","Markets"],

  ["finance","💰","Finance"]

 ];


 document.getElementById(
  "nav"
 ).innerHTML=

 labels.map(
  ([id,ic,name])=>

  `<button
   class="${tab===id?'active':''}"
   onclick="tab='${id}';render()"
  >
   ${ic}<br>${name}
  </button>`

 ).join("");

}


render();

</script>
