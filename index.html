<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calvin's City">
<title>Calvin's City</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:#101827ee;backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid #263247}
h1{font-size:24px;margin:0 0 4px}.sub,.muted,.small{color:#94a3b8}.sub{font-size:13px}
.screen{padding:16px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#141e2e;border:1px solid #263247;border-radius:16px;padding:14px;margin-bottom:12px}
.metric{font-size:23px;font-weight:700;margin-top:4px}.label{font-size:12px;color:#9aa8bd}.section{font-size:17px;font-weight:700;margin:18px 0 10px}
button{border:0;border-radius:12px;padding:12px 14px;background:#2b6df3;color:white;font-weight:700;font-size:14px;min-height:44px}
button.secondary{background:#263247}button.good{background:#15803d}.row{display:flex;gap:8px;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #263247}.item:last-child{border-bottom:0}
.log{max-height:220px;overflow:auto;font-size:12px;color:#b8c3d5}
 
/* SimCity-style map */
.city-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px}
.city-map{min-width:680px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,minmax(190px,auto));gap:8px;padding:10px;border-radius:20px;background:#09131f;border:1px solid #263b54}
.city-district{padding:10px;border-radius:15px;background:#142235;border:1px solid #314761;overflow:hidden}
.city-district:nth-child(1){grid-column:1/span 6;grid-row:1}.city-district:nth-child(2){grid-column:7/span 6;grid-row:1}
.city-district:nth-child(3){grid-column:1/span 6;grid-row:2}.city-district:nth-child(4){grid-column:7/span 6;grid-row:2}
.city-district:nth-child(5){grid-column:1/span 6;grid-row:3}.city-district:nth-child(6){grid-column:7/span 6;grid-row:3}
.city-district-head{display:flex;align-items:center;gap:7px;min-height:32px}.city-district-icon{font-size:22px;width:28px;text-align:center;flex:0 0 28px}
.city-district-name{font-size:12px;font-weight:800}.city-district-desc{color:#91a3ba;font-size:9px;line-height:1.2;margin-top:2px}
.city-street{height:6px;margin:7px 0;border-radius:5px;background:#34465b}.city-road-label{font-size:7px;color:#70849b;text-align:center;letter-spacing:.5px}
.city-parcels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.city-parcel{min-height:82px;padding:6px;border-radius:9px;background:#1a2b40;border:1px solid #334a64;display:flex;flex-direction:column;justify-content:space-between}
.city-parcel.available{background:#162d29}.city-parcel.owned{background:#192c4b}.city-parcel.built{background:#3a2b1a}
.city-parcel-id{font-size:8px;color:#91a3ba;font-weight:800}.city-building{display:flex;align-items:center;justify-content:center;min-height:30px}
.city-building-icon{font-size:22px;line-height:1}.city-building-name{font-size:8px;text-align:center;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city-status{font-size:7px;text-transform:uppercase;font-weight:800;color:#a9b7c9;text-align:center;margin-top:2px}
.city-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.city-legend span{font-size:9px;color:#a7b5c7;background:#18263a;border:1px solid #2b4058;border-radius:999px;padding:5px 7px}
.property-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.property-card{background:#101a2b;border:1px solid #2b3b55;border-radius:14px;padding:12px}
.property-title{font-weight:700;font-size:13px}.property-desc{font-size:10px;color:#94a3b8;margin:4px 0 9px;line-height:1.35}.cost{font-size:13px;font-weight:800;margin-bottom:8px}
.badge{font-size:9px;font-weight:800;padding:4px 6px;border-radius:999px;background:#263247;color:#cbd5e1;white-space:nowrap}.badge.available{background:#14532d;color:#86efac}.badge.owned{background:#1e3a8a;color:#bfdbfe}.badge.built{background:#78350f;color:#fde68a}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#101827f2;backdrop-filter:blur(14px);border-top:1px solid #263247;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(env(safe-area-inset-bottom) + 7px)}
.nav button{background:transparent;color:#8f9db2;padding:7px 2px;font-size:11px;min-height:42px}.nav button.active{color:white}
@media(max-width:600px){.city-map{min-width:640px}.property-grid{grid-template-columns:1fr 1fr}}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.property-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Calvin's City</h1><div class="sub" id="headerSub"></div></header>
<main id="app"></main><nav class="nav" id="nav"></nav>
<script>
const KEY="calvins_city_property_v1";
const fresh={
year:1,pop:10000,mwtp:20,econ:"Normal",fedRate:4,treasury:0,cityCash:500,propertyValue:0,
commodities:{Grain:2,Meat:2.2,Produce:1.8},
food:[
 {name:"Prosper Foods",cash:180,quality:7,brand:6,inventory:0,price:20},
 {name:"Whitmore Foods",cash:180,quality:8,brand:7,inventory:0,price:20}
],
banks:[{name:"First City Bank",cash:500,loans:0}],
stocks:[{name:"Prosper Foods",price:50,shares:1000000},{name:"Whitmore Foods",price:50,shares:1000000}],
properties:[
 ["DT-01","Downtown","Office","Medium",50],["DT-02","Downtown","Bank","Medium",40],
 ["N-01","North District","Apartment","Medium",35],["N-02","North District","Homes","Small",20],
 ["W-01","West Industrial","Factory","Large",60],["W-02","West Industrial","Warehouse","Medium",30],
 ["E-01","East Retail","Retail","Large",55],["E-02","East Retail","Restaurant","Medium",30],
 ["S-01","South District","Hotel","Large",70],["S-02","South District","Homes","Medium",30],
 ["SP-01","Sports District","Stadium","Landmark",100],["SP-02","Sports District","Stadium","Landmark",100],["SP-03","Sports District","Stadium","Landmark",100]
].map(x=>({id:x[0],district:x[1],type:x[2],size:x[3],price:x[4],status:"available",building:null})),
log:["Calvin's City founded. The map is now the physical foundation of the economy."]
};
let s=JSON.parse(localStorage.getItem(KEY)||"null")||fresh,tab="home";
const districtInfo={
"Downtown":["🏙️","Finance, offices and headquarters"],"North District":["🏘️","Permanent housing and apartments"],
"West Industrial":["🏭","Factories, warehouses and logistics"],"East Retail":["🛍️","Stores, restaurants and consumer businesses"],
"South District":["🏨","Hotels and residential development"],"Sports District":["🏀","Three stadiums and the sports economy"]
};
const buildingInfo={Office:["Office Building","🏢"],Bank:["Bank Branch","🏦"],Apartment:["Apartment Building","🏬"],Homes:["Housing","🏠"],Factory:["Factory","🏭"],Warehouse:["Warehouse","📦"],Retail:["Retail Center","🛍️"],Restaurant:["Restaurant","🍽️"],Hotel:["Hotel","🏨"],Stadium:["Stadium","🏟️"]};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function money(x){return "$"+Number(x).toFixed(2)+"M"}
function log(x){s.log.unshift("Y"+s.year+": "+x);s.log=s.log.slice(0,70);save()}
function roll(){return Math.floor(Math.random()*6)+1+Math.floor(Math.random()*6)+1}
function card(title,body){return `<div class="card"><div class="section" style="margin-top:0">${title}</div>${body}</div>`}
 
function buyProperty(id){let p=s.properties.find(x=>x.id===id);if(!p||p.status!="available")return;if(s.cityCash<p.price)return alert("Not enough city capital.");s.cityCash-=p.price;s.propertyValue+=p.price;p.status="owned";log("City acquired "+p.id+" in "+p.district+" for "+money(p.price)+".");render()}
function buildProperty(id){let p=s.properties.find(x=>x.id===id);if(!p||p.status!="owned")return;let cost=Math.round(p.price*.35*100)/100;if(s.cityCash<cost)return alert("Not enough development capital.");s.cityCash-=cost;p.status="built";p.building=buildingInfo[p.type][0];log("Built "+p.building+" on "+p.id+" for "+money(cost)+".");render()}
function sellProperty(id){let p=s.properties.find(x=>x.id===id);if(!p||p.status=="available")return;let value=p.price*(p.status=="built"?1.15:1);s.cityCash+=value;s.propertyValue-=p.price;log("Sold "+p.id+" for "+money(value)+".");p.status="available";p.building=null;render()}
 
function city(){
const districts=Object.keys(districtInfo);
return `<div class="screen">
${card("🏙️ City Map",`
 <div class="city-scroll"><div class="city-map">
  ${districts.map(d=>{
   const props=s.properties.filter(p=>p.district===d),built=props.filter(p=>p.status==="built").length;
   return `<section class="city-district">
    <div class="city-district-head"><div class="city-district-icon">${districtInfo[d][0]}</div><div>
     <div class="city-district-name">${d}</div><div class="city-district-desc">${districtInfo[d][1]}</div>
    </div></div>
    <div class="city-street"></div><div class="city-road-label">CITY STREET</div>
    <div class="city-parcels">${props.map(p=>`<div class="city-parcel ${p.status}" onclick="tab='property';render()">
     <div class="city-parcel-id">${p.id} • ${p.size}</div>
     <div class="city-building"><div>
      <div class="city-building-icon">${p.building?buildingInfo[p.type][1]:"▫️"}</div>
      <div class="city-building-name">${p.building||"Empty Lot"}</div>
     </div></div>
     <div class="city-status">${p.status}</div>
    </div>`).join("")}</div>
    <div class="city-street"></div>
    <div class="city-road-label">${built}/${props.length} DEVELOPED</div>
   </section>`}).join("")}
 </div></div>
 <div class="city-legend"><span>▫️ Empty lot</span><span>🏢 Building</span><span>🛣️ Road</span><span>🟢 Available</span><span>🟦 Owned</span><span>🟤 Built</span></div>
 <div class="small" style="margin-top:8px">Swipe left/right on the map to see the full city on smaller iPhones.</div>
`)}
${card("🏗️ City Development",`<p class="muted">Every property is represented as a physical parcel. As businesses are added, their buildings will occupy these lots.</p><button onclick="tab='property';render()">🏗️ Manage Property</button>`)}
</div>`
}
 
function propertyMarket(){
const owned=s.properties.filter(p=>p.status!="available").length,built=s.properties.filter(p=>p.status=="built").length;
return `<div class="screen">
${card("🏗️ Property Market",`<div class="grid">
 <div><div class="label">City capital</div><div class="metric">${money(s.cityCash)}</div></div>
 <div><div class="label">Property value</div><div class="metric">${money(s.propertyValue)}</div></div>
 <div><div class="label">Properties owned</div><div class="metric">${owned}</div></div>
 <div><div class="label">Buildings built</div><div class="metric">${built}</div></div>
</div><p class="muted">Land is bought first. Construction costs 35% of land value.</p>`)}
${card("Available Land",`<div class="property-grid">${s.properties.filter(p=>p.status=="available").map(p=>`<div class="property-card">
 <div class="property-title">${p.id} • ${p.district}</div><div class="property-desc">${p.size} ${p.type} parcel</div><div class="cost">${money(p.price)}</div>
 <button onclick="buyProperty('${p.id}')">Buy Property</button></div>`).join("")}</div>`)}
${card("Your Properties",owned?`<div class="property-grid">${s.properties.filter(p=>p.status!="available").map(p=>`<div class="property-card">
 <div class="property-title">${p.id} • ${p.district}</div><div class="property-desc">${p.size} ${p.type}</div><div class="badge ${p.status}">${p.status.toUpperCase()}</div>
 <div style="margin-top:8px;font-size:18px">${p.building?buildingInfo[p.type][1]+" "+p.building:"▫️ Raw land"}</div>
 <div class="row" style="margin-top:10px">${p.status=="owned"?`<button onclick="buildProperty('${p.id}')">Build ${money(p.price*.35)}</button>`:""}<button class="secondary" onclick="sellProperty('${p.id}')">Sell</button></div>
</div>`).join("")}</div>`:`<div class="muted">You do not own any property yet.</div>`)}
</div>`
}
function home(){return `<div class="screen">
${card("City Overview",`<div class="grid"><div><div class="label">Population</div><div class="metric">${s.pop.toLocaleString()}</div></div><div><div class="label">Economy</div><div class="metric">${s.econ}</div></div><div><div class="label">City Capital</div><div class="metric">${money(s.cityCash)}</div></div><div><div class="label">Property Value</div><div class="metric">${money(s.propertyValue)}</div></div></div>`)}
${card("City Development",`<p class="muted">The map now shows the physical city. Property remains connected underneath it.</p><div class="row"><button onclick="tab='city';render()">🏙️ View City</button><button onclick="tab='property';render()">🏗️ Buy Property</button></div>`)}
${card("Yearly Controls",`<div class="row"><button onclick="popRoll();render()">🎲 Population</button><button onclick="econRoll();render()">🎲 Economy</button><button onclick="mwtpReset();render()">💵 MWTP</button><button onclick="commodityRoll();render()">🌾 Commodities</button><button class="good" onclick="newYear()">▶ Start New Year</button></div>`)}
${card("Recent Activity",`<div class="log">${s.log.map(x=>`<div style="padding:5px 0">${x}</div>`).join("")}</div>`)}
</div>`}
function markets(){return `<div class="screen">${card("Commodity Market",Object.entries(s.commodities).map(([k,v])=>`<div class="item"><span>${k}</span><b>${money(v)}</b></div>`).join(""))}${card("Food Competition",s.food.map(f=>`<div class="card" style="background:#101827"><b>${f.name}</b><div class="item"><span>Price</span><b>${money(f.price)}</b></div><div class="item"><span>Quality / Brand</span><span>${f.quality}/10 • ${f.brand}/10</span></div><div class="item"><span>Cash</span><b>${money(f.cash)}</b></div></div>`).join(""))}</div>`}
function finance(){return `<div class="screen">${card("Federal Treasury",`<div class="metric">${money(s.treasury)}</div><div class="muted">Collected from modeled transaction taxes.</div>`)}${card("Federal Reserve",`<div class="item"><span>Policy rate</span><b>${s.fedRate.toFixed(2)}%</b></div><div class="row"><button class="secondary" onclick="s.fedRate=Math.max(0,s.fedRate-.25);log('Fed cut rates 0.25%.');render()">−0.25%</button><button class="secondary" onclick="s.fedRate+=.25;log('Fed raised rates 0.25%.');render()">+0.25%</button></div>`)}${card("Banks",s.banks.map(b=>`<div class="item"><span>${b.name}</span><b>${money(b.cash)}</b></div>`).join(""))}${card("Stock Market",s.stocks.map(x=>`<div class="item"><span>${x.name}</span><b>$${x.price.toFixed(2)}</b></div>`).join(""))}</div>`}
function econRoll(){let r=roll();s.econ=r<=4?"Recession":r<=9?"Normal":"Boom";log("Economic roll: "+r+" → "+s.econ);return r}
function popRoll(){let r=roll(),pct=r<=4?-1:r<=6?0:r<=8?1:r<=10?2:3;s.pop=Math.max(1000,Math.round(s.pop*(1+pct/100)));log("Population roll "+r+" → "+(pct>=0?"+":"")+pct+"%.")}
function mwtpReset(){let r=roll(),pct=(s.econ=="Boom"?2:s.econ=="Recession"?-2:0)+(r>=10?2:r<=4?-2:0);s.mwtp=Math.max(5,Math.round(s.mwtp*(1+pct/100)*100)/100);log("MWTP reset → "+money(s.mwtp)+" per meal.")}
function commodityRoll(){const moves={2:-10,3:-8,4:-6,5:-4,6:-2,7:2,8:4,9:6,10:8,11:10,12:12},r=roll();for(const k in s.commodities)s.commodities[k]=Math.round(s.commodities[k]*(1+moves[r]/100)*100)/100;log("Commodity roll "+r+" → "+(moves[r]>=0?"+":"")+moves[r]+"%.")}
function newYear(){s.year++;popRoll();econRoll();mwtpReset();commodityRoll();save();render()}
function render(){
document.getElementById("headerSub").textContent=`Year ${s.year} • ${s.econ} Economy`;
const pages={home,city,property:propertyMarket,markets,finance};
document.getElementById("app").innerHTML=pages[tab]();
const labels=[["home","⌂","Home"],["city","🏙","City"],["property","🏗","Property"],["markets","📊","Markets"],["finance","💰","Finance"]];
document.getElementById("nav").innerHTML=labels.map(([id,ic,name])=>`<button class="${tab==id?"active":""}" onclick="tab='${id}';render()">${ic}<br>${name}</button>`).join("");
save();
}
render();
</script>
</body>
</html>
